<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>You're Invited</title>
<meta name="description" content="Watch our invitation video" />
<style>
  :root {
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #0b0b0d;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 16px;
  }
  .wrap {
    width: 100%;
    max-width: 480px;
    text-align: center;
  }
  h1 {
    color: #f5f5f7;
    font-size: 1.4rem;
    font-weight: 600;
    margin: 0 0 16px;
  }
  video {
    width: 100%;
    max-height: 85vh;
    border-radius: 14px;
    background: #000;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>You're Invited 🎉</h1>
    <video
      src="welcome.mp4"
      controls
      autoplay
      playsinline
      preload="auto"
    >
      Your browser doesn't support embedded video.
      <a href="welcome.mp4">Download the video</a> instead.
    </video>
  </div>
</body>
</html>
